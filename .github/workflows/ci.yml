name: CI

# Zakaj ta workflow obstaja
# -------------------------
# Projekt je imel `typescript.ignoreBuildErrors: true` v next.config.ts in vsa
# smiselna ESLint pravila izklopljena, zato se 15 tipskih napak ni nikoli pokazalo.
# Pod njimi so bili trije pravi izračunski hrošči (razmik stebrov čez maksimum
# sistema, statika stekla, ki je za vsak vhod vrnila "nevarno", in 900 mm
# minimalna višina ograje). Nobenega ni bilo mogoče opaziti brez avtomatskega
# preverjanja — vsi trije vrnejo veljavno številko, ki je samo napačna.
#
# S+9 (issue #4, korak 1): CI teče proti REALNEMU PostgreSQL (service
# container) — ista arhitektura kot produkcija. `prisma migrate deploy`
# v CI je hkrati regresijsko varovanje verige verzioniranih migracij.
# Vitesti sami zagotovijo svojo embedded PG instanco za roksal_test.
#
# Vrstni red korakov je namenoma od najhitrejšega proti najpočasnejšemu:
# tipi (30 s) → testi (min) → gradnja (minute).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipi, testi, gradnja
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roksal
          POSTGRES_PASSWORD: roksal
          POSTGRES_DB: roksal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roksal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Produkcija in CI = isti vir: zunanji PostgreSQL (issue #4).
      DATABASE_URL: 'postgresql://roksal:roksal@localhost:5432/roksal_ci'
      NEXT_TELEMETRY_DISABLED: '1'
      # Gradnja je pomnilniško zahtevna zaradi velikih komponent
      # (measurements-tab.tsx 7.543 vrstic, calculator-tab.tsx 5.791).
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Predpomnjenje bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Namestitev odvisnosti
        run: bun install --frozen-lockfile

      # R127 (issue #5 §1): demo poverilnice ne smejo obstajati v repozitoriju.
      # Zgodovinsko geslo je bilo v README/seedu — ta korak prepreči vrnitev.
      # (Nekega dne lahko seznam dopolniš; fail = najdena skrivnost.)
      - name: Skeniranje skrivnosti (demo credentials morajo biti mrtvi)
        run: |
          # Literala je sestavljena iz dveh delov, da skeniranje ne najde same sebe.
          P="Roksal""Demo2026"
          if git grep -nI "$P" -- . ':!*.lock'; then
            echo "✗ NAJDENO demo geslo v repozitoriju (issue #5 §1) — odstrani/redigiraj.";
            exit 1
          fi
          echo "✓ ni demo poverilnic v tracked datotekah"

      - name: Prisma Client (PostgreSQL)
        run: bunx prisma generate

      # Verzionirane migracije (prisma/migrations) — reproducible build baze.
      # Če ta korak pade, je migracijska veriga pokvarjena — popravi SQL.
      - name: Migracije (kot na produkciji)
        run: bunx prisma migrate deploy

      # 0 napak je trenutno stanje. Če ta korak pade, je napaka resnična —
      # ne dodajaj nazaj ignoreBuildErrors, popravi kodo.
      - name: Tipska kontrola
        run: bunx tsc --noEmit

      - name: Testi (428, proti embedded PG roksal_test)
        run: bun run test

      - name: Gradnja
        run: bun run build

      - name: Naloži gradbene artefakte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .next/trace
            dev.log
            server.log
          if-no-files-found: ignore
          retention-days: 7

  # Varnostni dimni test na ŽIVEM strežniku.
  #
  # Enotski testi preverijo kriptografijo, ne morejo pa ujeti napake v plasteh —
  # prva različica proxy-ja je blokirala ravno prijavo: 32/46 preverjanj je bilo
  # zelenih, aplikacija pa neuporabna. Zato se tu zažene pravi strežnik in
  # preveri, da anonimni uporabnik dobi 401 na vseh podatkovnih rutah.
  security:
    name: Varnost (143 preverjanj na živem strežniku)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roksal
          POSTGRES_PASSWORD: roksal
          POSTGRES_DB: roksal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roksal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: 'postgresql://roksal:roksal@localhost:5432/roksal_ci'
      SESSION_SECRET: 'ci-only-secret-32-chars-minimum-xyz'
      API_KEY_PEPPER: 'ci-only-pepper'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Predpomnjenje bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Pripravi bazo, profile in administratorja
        run: |
          bunx prisma generate
          bunx prisma migrate deploy
          bunx tsx prisma/seed.ts
          bunx tsx tools/create-admin.ts ci@roksal.si 'CiGeslo12345' ADMIN 'CI Admin'
          # Monter za preizkus vlog: brati sme, pisati cen/zalog/naročil ne.
          bunx tsx tools/create-admin.ts monter.ci@roksal.si 'CiMonter12345' MONTER 'CI Monter'

      - name: Ustvari API ključ za mobilni klient
        run: |
          bunx tsx tools/create-api-key.ts "CI test" > /tmp/key.txt
          grep 'Ključ:' /tmp/key.txt | sed 's/.*Ključ: *//' | tr -d ' \r' > /tmp/key
          echo "API_KEY=$(cat /tmp/key)" >> "$GITHUB_ENV"
          echo "ključ ustvarjen (dolžina $(wc -c < /tmp/key))"

      - name: Zaženi strežnik in počakaj
        run: |
          bun run dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api > /dev/null 2>&1; then
              echo "strežnik pripravljen po $((i*2)) s"; exit 0
            fi
            sleep 2
          done
          echo "✗ strežnik se ni zagnal"; tail -60 /tmp/dev.log; exit 1

      - name: Varnostni dimni test
        run: |
          BASE_URL=http://127.0.0.1:3000 \
          EMAIL=ci@roksal.si \
          PASSWORD='CiGeslo12345' \
          MONTER_EMAIL=monter.ci@roksal.si \
          MONTER_PASSWORD='CiMonter12345' \
            python3 tools/security-smoke.py

      - name: Dnevnik strežnika ob napaki
        if: failure()
        run: tail -120 /tmp/dev.log
