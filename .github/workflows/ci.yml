name: CI

# Zakaj ta workflow obstaja
# -------------------------
# Projekt je imel `typescript.ignoreBuildErrors: true` v next.config.ts in vsa
# smiselna ESLint pravila izklopljena, zato se 15 tipskih napak ni nikoli pokazalo.
# Pod njimi so bili trije pravi izračunski hrošči (razmik stebrov čez maksimum
# sistema, statika stekla, ki je za vsak vhod vrnila "nevarno", in 900 mm
# minimalna višina ograje). Nobenega ni bilo mogoče opaziti brez avtomatskega
# preverjanja — vsi trije vrnejo veljavno številko, ki je samo napačna.
#
# Vrstni red korakov je namenoma od najhitrejšega proti najpočasnejšemu:
# tipi (30 s) → testi (1 s) → gradnja (minute).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipi, testi, gradnja
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # .env ni več v gitu, zato mora CI podati svojo pot do baze.
      # Prisma rešuje relativne SQLite poti glede na prisma/schema.prisma.
      DATABASE_URL: 'file:../db/custom.db'
      NEXT_TELEMETRY_DISABLED: '1'
      # Gradnja je pomnilniško zahtevna zaradi velikih komponent
      # (measurements-tab.tsx 7.543 vrstic, calculator-tab.tsx 5.791).
      NODE_OPTIONS: '--max-old-space-size=4096'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Predpomnjenje bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Namestitev odvisnosti
        run: bun install --frozen-lockfile

      - name: Prisma Client
        run: bunx prisma generate

      # Baza NI več v gitu (v javnem repu bi bili sčasoma pravi podatki strank),
      # zato jo mora CI ustvariti sam — enako kot svež klon na strežniku.
      # Brez tega koraka gradnja pade, ker src/lib/db.ts ob statičnem
      # predizrisu konstruira PrismaClient nad neobstoječo datoteko.
      - name: Pripravi bazo (kot na svežem klonu)
        run: |
          mkdir -p db
          bunx prisma db push
          bunx tsx prisma/seed.ts

      # 0 napak je trenutno stanje. Če ta korak pade, je napaka resnična —
      # ne dodajaj nazaj ignoreBuildErrors, popravi kodo.
      - name: Tipska kontrola
        run: bunx tsc --noEmit

      - name: Testi (104)
        run: bun run test

      - name: Gradnja
        run: bun run build

      - name: Naloži gradbene artefakte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .next/trace
            dev.log
            server.log
          if-no-files-found: ignore
          retention-days: 7

  # Varnostni dimni test na ŽIVEM strežniku.
  #
  # Enotski testi preverijo kriptografijo, ne morejo pa ujeti napake v plasteh —
  # prva različica proxy-ja je blokirala ravno prijavo: 32/46 preverjanj je bilo
  # zelenih, aplikacija pa neuporabna. Zato se tu zažene pravi strežnik in
  # preveri, da anonimni uporabnik dobi 401 na vseh podatkovnih rutah.
  security:
    name: Varnost (77 preverjanj na živem strežniku)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15

    env:
      DATABASE_URL: 'file:../db/custom.db'
      SESSION_SECRET: 'ci-only-secret-32-chars-minimum-xyz'
      API_KEY_PEPPER: 'ci-only-pepper'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Predpomnjenje bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Pripravi bazo, profile in administratorja
        run: |
          mkdir -p db
          bunx prisma generate
          bunx prisma db push
          bunx tsx prisma/seed.ts
          bunx tsx tools/create-admin.ts ci@roksal.si 'CiGeslo12345' ADMIN 'CI Admin'
          # Monter za preizkus vlog: brati sme, pisati cen/zalog/naročil ne.
          bunx tsx tools/create-admin.ts monter.ci@roksal.si 'CiMonter12345' MONTER 'CI Monter'

      - name: Ustvari API ključ za mobilni klient
        run: |
          bunx tsx tools/create-api-key.ts "CI test" > /tmp/key.txt
          grep 'Ključ:' /tmp/key.txt | sed 's/.*Ključ: *//' | tr -d ' \r' > /tmp/key
          echo "API_KEY=$(cat /tmp/key)" >> "$GITHUB_ENV"
          echo "ključ ustvarjen (dolžina $(wc -c < /tmp/key))"

      - name: Zaženi strežnik in počakaj
        run: |
          bun run dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api > /dev/null 2>&1; then
              echo "strežnik pripravljen po $((i*2)) s"; exit 0
            fi
            sleep 2
          done
          echo "✗ strežnik se ni zagnal"; tail -60 /tmp/dev.log; exit 1

      - name: Varnostni dimni test
        run: |
          BASE_URL=http://127.0.0.1:3000 \
          EMAIL=ci@roksal.si \
          PASSWORD='CiGeslo12345' \
          MONTER_EMAIL=monter.ci@roksal.si \
          MONTER_PASSWORD='CiMonter12345' \
            python3 tools/security-smoke.py

      - name: Dnevnik strežnika ob napaki
        if: failure()
        run: tail -120 /tmp/dev.log
