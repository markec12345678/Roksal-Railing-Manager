<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — Roksal Railing Manager</title>
  <link rel="icon" href="/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #f7f9ff 0%, #eef2fa 100%);
      padding: 24px;
      color: #1d2b3e;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(29, 43, 62, .08);
      border: 1px solid rgba(29, 43, 62, .06);
    }
    .logo {
      width: 56px; height: 56px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1d2b3e, #2a3f5f);
      display: flex; align-items: center; justify-content: center;
      color: #f59e0b;
      font-size: 26px;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(29, 43, 62, .25);
    }
    .signal {
      width: 44px; height: 44px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #fef3c7;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .55; transform: scale(.92); }
    }
    h1 { font-size: 18px; margin-bottom: 8px; letter-spacing: -.01em; }
    p { font-size: 13px; color: #64748b; line-height: 1.55; margin-bottom: 18px; }
    .queue {
      display: none;
      margin: 0 auto 18px;
      padding: 10px 14px;
      border-radius: 12px;
      background: #fef3c7;
      border: 1px solid #fde68a;
      font-size: 12px;
      color: #92400e;
      line-height: 1.5;
    }
    .queue b { font-size: 15px; }
    button {
      min-height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 12px;
      background: #1d2b3e;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:active { transform: scale(.97); }
    .spin {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: rot .8s linear infinite;
      display: none;
    }
    .checking .spin { display: inline-block; }
    .checking .arrow { display: none; }
    @keyframes rot { to { transform: rotate(360deg); } }
    .hint { margin-top: 14px; font-size: 11px; color: #94a3b8; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; margin-right: 5px; vertical-align: 1px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">R</div>
    <div class="signal">📡</div>
    <h1>Ni povezave</h1>
    <p>Strani trenutno ni mogoče naložiti. Merjenje z AR kamero deluje naprej — zapisi se samodejno pošljejo, ko povezava pride nazaj.</p>
    <div class="queue" id="queue" role="status">
      <b id="queue-n">0</b> <span id="queue-t">zapisov</span> čaka na pošiljanje<br>
      Ostanejo ohranjeni — nič ne gre izgubiti.
    </div>
    <button id="retry" onclick="retryNow()">
      <span class="spin"></span>
      <span class="arrow">&#8635;</span>
      <span id="retry-label">Poskusi znova</span>
    </button>
    <p class="hint"><span class="dot"></span>Samodejni poskus ob vsaki vrnitvi povezave<br>Roksal Railing Manager · PWA</p>
  </div>
  <script>
    // R131 (§5): offline stran ni mrtva — pokaže števec offline vrste (IndexedDB
    // `roksal-offline`) in samodejno poskusi ob `online` dogodku ter vsakih 15 s.
    (function () {
      var DB = 'roksal-offline', STORE = 'requests';
      function countQueue() {
        try {
          var open = indexedDB.open(DB);
          open.onsuccess = function () {
            var db = open.result;
            try {
              var tx = db.transaction(STORE, 'readonly');
              var req = tx.objectStore(STORE).count();
              req.onsuccess = function () {
                var n = req.result || 0;
                var el = document.getElementById('queue');
                document.getElementById('queue-n').textContent = String(n);
                document.getElementById('queue-t').textContent = (n === 1) ? 'zapis' : (n === 2 ? 'zapisa' : 'zapisov');
                el.style.display = n > 0 ? 'block' : 'none';
              };
            } catch (e) { /* store še ne obstaja — vrsta je prazna */ }
            db.close();
          };
        } catch (e) { /* IndexedDB ni dosegljiv */ }
      }
      function setChecking(on) {
        var btn = document.getElementById('retry');
        var label = document.getElementById('retry-label');
        btn.classList.toggle('checking', on);
        label.textContent = on ? 'Preverjam …' : 'Poskusi znova';
      }
      function retryNow() {
        setChecking(true);
        // Kratka mrežna proba namesto polnega reloada — če je povezava nazaj,
        // gre uporabnik takoj naprej; sicer ostane na tej strani.
        fetch('/', { method: 'HEAD', cache: 'no-store' })
          .then(function () { location.replace('/'); })
          .catch(function () {
            setTimeout(function () { setChecking(false); }, 600);
          });
      }
      window.retryNow = retryNow;
      window.addEventListener('online', function () { location.replace('/'); });
      setInterval(function () {
        // Tihi poskus ob odsotnosti uporabniške interakcije.
        fetch('/', { method: 'HEAD', cache: 'no-store' })
          .then(function () { location.replace('/'); })
          .catch(function () { /* še vedno offline */ });
      }, 15000);
      countQueue();
    })();
  </script>
</body>
</html>
