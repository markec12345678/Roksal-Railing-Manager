# Roksal GPU backend — docker-compose za GPU stroj (spec §1).
# Uporaba: docker compose up -d --build   (ob prvem zagonu se ~40GB model prenese 1×)
services:
  qwen-edit:
    build: .
    container_name: roksal-qwen
    ports: ["8000:8000"]
    environment:
      - QWEN_MODEL_ID=Qwen/Qwen-Image-Edit-2509   # Apache-2.0 (spec §3)
      - QWEN_DEVICE=cuda
      - QWEN_CPU_OFFLOAD=0        # spec §4: najprej NEoptimizirano + izmerjen vrh VRAM
      - QWEN_OUTPUT_DIR=/data/jobs
      # S+7 (R319) — OBVEZEN ključ (fail-closed: brez njega poslovne točke
      # odklonijo s 503). Ustvari z: openssl rand -hex 32
      # Vrednost mora biti ENAKA kot VIZ_GPU_TOKEN v .env aplikacije.
      - QWEN_API_KEY=${QWEN_API_KEY:?QWEN_API_KEY je obvezen — glej gpu-backend/README.md (S+7)}
    volumes:
      - hf-cache:/data/hf-cache
      - jobs:/data/jobs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf-cache:
  jobs:
